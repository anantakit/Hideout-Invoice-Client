<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151821" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>Hideout — Hotel Operations</title>
    <script>
      // Prevent FOUC: apply saved theme class before first paint
      (function(){
        var t = localStorage.getItem('hideout-theme');
        // If no stored preference, follow OS; otherwise use stored value
        var isLight = t ? t === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (isLight) document.documentElement.classList.add('light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      ── Premium Splash Screen ──
      Token mapping (mirrors index.css :root):
        --background  : hsl(224 16% 10%)  = #151821
        --primary     : hsl(222 85% 64%)  = #5B8CFF
        --foreground  : hsl(218 16% 92%)  = #E6EAF2
        --muted-fg    : hsl(218 10% 60%)  = #8B95A5
        --card        : hsl(224 18% 14%)  = #1C212B
        --sidebar     : hsl(224 20% 12%)  = #181C25
    -->
    <div id="splash" class="splash">
      <style>
        /* ── Tokens ───────────────────────────────────────────────────── */
        .splash {
          --sp-bg:         hsl(224 16% 7%);
          --sp-accent:     hsl(222 85% 64%);
          --sp-text:       hsl(218 16% 94%);
          --sp-text-sub:   hsl(218 10% 52%);
          --sp-ease:       cubic-bezier(.4, 0, .2, 1);
          --sp-spring:     cubic-bezier(.16, 1, .3, 1);
        }

        /* ── Root ─────────────────────────────────────────────────────── */
        .splash {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          background: var(--sp-bg);
          overflow: hidden;
          font-family: Inter, system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing: antialiased;
          transition: opacity .5s var(--sp-ease);
        }

        /* ── Background ───────────────────────────────────────────────── */
        .splash__background {
          position: absolute; inset: 0; overflow: hidden;
        }
        .splash__background::before,
        .splash__background::after {
          content: ''; position: absolute; border-radius: 50%;
          filter: blur(90px);
          animation: sp-ambient 12s var(--sp-ease) infinite alternate;
        }
        .splash__background::before {
          width: 500px; height: 500px;
          top: -15%; left: -10%;
          background: radial-gradient(circle, hsl(222 85% 64% / .10), transparent 70%);
        }
        .splash__background::after {
          width: 600px; height: 600px;
          bottom: -20%; right: -15%;
          background: radial-gradient(circle, hsl(260 60% 60% / .06), transparent 70%);
          animation-delay: -6s;
        }
        @keyframes sp-ambient {
          0%   { transform: translate(0, 0) scale(1) }
          100% { transform: translate(30px, -20px) scale(1.1) }
        }

        .splash__grid {
          position: absolute; inset: 0;
          background-image:
            linear-gradient(hsl(224 16% 16% / .25) 1px, transparent 1px),
            linear-gradient(90deg, hsl(224 16% 16% / .25) 1px, transparent 1px);
          background-size: 60px 60px;
          mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, black 20%, transparent 70%);
          -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, black 20%, transparent 70%);
          opacity: .3;
        }

        /* ── Content ──────────────────────────────────────────────────── */
        .splash__content {
          position: relative; z-index: 1;
          display: flex; flex-direction: column; align-items: center;
        }

        /* ── Shared enter animation ───────────────────────────────────── */
        @keyframes sp-up {
          from { opacity: 0; transform: translateY(14px) }
          to   { opacity: 1; transform: translateY(0) }
        }

        /* ── Logo — no container, just the floating mark ──────────────── */
        .splash__logo {
          position: relative;
          display: flex; align-items: center; justify-content: center;
          animation: sp-float 4s ease-in-out 1.6s infinite;
        }
        @keyframes sp-float {
          0%, 100% { transform: translateY(0) }
          50%      { transform: translateY(-6px) }
        }

        .splash__logo svg {
          position: relative; z-index: 1;
          filter: drop-shadow(0 4px 20px hsl(222 85% 64% / .25))
                  drop-shadow(0 8px 30px hsl(0 0% 0% / .20));
        }

        /* Ambient glow behind the H */
        .splash__logo-glow {
          position: absolute;
          width: 140px; height: 140px;
          border-radius: 50%;
          background: radial-gradient(circle, hsl(222 85% 64% / .14), transparent 65%);
          opacity: 0;
          animation: sp-up .8s var(--sp-ease) .9s forwards;
        }

        /* ── Piece assembly ───────────────────────────────────────────── */
        .sp-piece { opacity: 0 }

        .sp-piece--left {
          animation: sp-piece-l .7s var(--sp-spring) .15s forwards;
        }
        .sp-piece--right {
          animation: sp-piece-r .7s var(--sp-spring) .35s forwards;
        }
        .sp-piece--bar {
          animation: sp-piece-b .6s var(--sp-spring) .55s forwards;
        }

        @keyframes sp-piece-l {
          from { opacity: 0; transform: translateX(-18px) }
          to   { opacity: 1; transform: translateX(0) }
        }
        @keyframes sp-piece-r {
          from { opacity: 0; transform: translateX(18px) }
          to   { opacity: 1; transform: translateX(0) }
        }
        @keyframes sp-piece-b {
          from { opacity: 0; transform: translateY(-10px) scaleX(.85) }
          to   { opacity: 1; transform: translateY(0) scaleX(1) }
        }

        /* ── Brand typography ─────────────────────────────────────────── */
        .splash__brand {
          margin-top: 40px; text-align: center;
          display: flex; flex-direction: column; align-items: center;
          opacity: 0;
          animation: sp-up .7s var(--sp-ease) .85s forwards;
        }
        .splash__title {
          font-size: 28px; font-weight: 600; letter-spacing: .28em;
          color: var(--sp-text); line-height: 1;
          text-indent: .28em;
        }
        .splash__divider {
          width: 36px; height: 1px; margin-top: 14px;
          background: linear-gradient(90deg, transparent, var(--sp-accent), transparent);
          opacity: .3;
        }
        .splash__subtitle {
          font-size: 12px; font-weight: 400; letter-spacing: .45em;
          color: var(--sp-text-sub); margin-top: 12px;
          text-indent: .45em;
        }

        /* ── Progress bar loader ──────────────────────────────────────── */
        .splash__loader {
          margin-top: 48px;
          width: 120px; height: 2px;
          background: hsl(224 14% 18%);
          border-radius: 1px;
          overflow: hidden;
          opacity: 0;
          animation: sp-up .5s var(--sp-ease) 1.1s forwards;
        }
        .splash__loader-bar {
          width: 40%; height: 100%;
          border-radius: 1px;
          background: linear-gradient(90deg, var(--sp-accent), hsl(222 85% 76%));
          animation: sp-progress 1.8s var(--sp-ease) infinite;
        }
        @keyframes sp-progress {
          0%   { transform: translateX(-100%) }
          100% { transform: translateX(350%) }
        }

        /* ── Status messages ──────────────────────────────────────────── */
        .splash__status {
          margin-top: 20px; height: 20px;
          font-size: 13px; font-weight: 400;
          color: var(--sp-text-sub);
          letter-spacing: .02em;
          opacity: 0;
          animation: sp-up .5s var(--sp-ease) 1.3s forwards;
        }

        /* ── Footer ───────────────────────────────────────────────────── */
        .splash__footer {
          position: absolute;
          bottom: max(28px, env(safe-area-inset-bottom, 28px));
          z-index: 1;
          font-size: 10px; font-weight: 500; letter-spacing: .18em;
          color: var(--sp-text-sub);
          opacity: .4;
          text-indent: .18em;
        }

        /* ── Reduced motion ───────────────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
          .splash__logo,
          .splash__background::before,
          .splash__background::after,
          .splash__loader-bar { animation: none }
          .sp-piece { opacity: 1 }
          .splash__logo-glow { opacity: 1 }
        }
      </style>

      <!-- Background layers -->
      <div class="splash__background">
        <div class="splash__grid"></div>
      </div>

      <!-- Main content -->
      <div class="splash__content">

        <!-- Logo mark — bare icon, no container -->
        <div class="splash__logo">
          <div class="splash__logo-glow"></div>
          <svg width="104" height="104" viewBox="0 0 100 100" fill="none">
            <defs>
              <linearGradient id="sp-front" x1="14" y1="50" x2="88" y2="50" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1838A8"/>
                <stop offset="35%" stop-color="#3562E0"/>
                <stop offset="70%" stop-color="#7BA4FF"/>
                <stop offset="100%" stop-color="#E4EDFF"/>
              </linearGradient>
              <linearGradient id="sp-top" x1="14" y1="50" x2="88" y2="50" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#5078F0"/>
                <stop offset="35%" stop-color="#6B94FF"/>
                <stop offset="70%" stop-color="#A8CCFF"/>
                <stop offset="100%" stop-color="#F2F6FF"/>
              </linearGradient>
              <linearGradient id="sp-side" x1="14" y1="50" x2="88" y2="50" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0E2278"/>
                <stop offset="35%" stop-color="#1E3FA8"/>
                <stop offset="70%" stop-color="#4468C0"/>
                <stop offset="100%" stop-color="#8898B8"/>
              </linearGradient>
            </defs>
            <!-- Left pillar -->
            <g class="sp-piece sp-piece--left">
              <path d="M28,19 L30,17 L30,81 L28,83 Z" fill="url(#sp-side)"/>
              <path d="M14,19 L28,19 L30,17 L16,17 Z" fill="url(#sp-top)"/>
              <path d="M14,19 L28,19 L28,83 L14,83 Z" fill="url(#sp-front)"/>
            </g>
            <!-- Right pillar -->
            <g class="sp-piece sp-piece--right">
              <path d="M86,19 L88,17 L88,81 L86,83 Z" fill="url(#sp-side)"/>
              <path d="M72,19 L86,19 L88,17 L74,17 Z" fill="url(#sp-top)"/>
              <path d="M72,19 L86,19 L86,83 L72,83 Z" fill="url(#sp-front)"/>
            </g>
            <!-- Crossbar -->
            <g class="sp-piece sp-piece--bar">
              <path d="M72,44 L74,42 L74,56 L72,58 Z" fill="url(#sp-side)"/>
              <path d="M28,44 L72,44 L74,42 L30,42 Z" fill="url(#sp-top)"/>
              <path d="M28,44 L72,44 L72,58 L28,58 Z" fill="url(#sp-front)"/>
            </g>
          </svg>
        </div>

        <!-- Brand name -->
        <div class="splash__brand">
          <div class="splash__title">HIDEOUT</div>
          <div class="splash__divider"></div>
          <div class="splash__subtitle">RESORT</div>
        </div>

        <!-- Progress bar loader -->
        <div class="splash__loader">
          <div class="splash__loader-bar"></div>
        </div>

        <!-- Status text -->
        <div class="splash__status" id="sp-msg"></div>

      </div>

      <!-- Footer -->
      <div class="splash__footer">HOTEL OPERATIONS</div>

      <!-- Splash logic -->
      <script>
        (function () {
          var messages = [
            'Syncing room availability\u2026',
            'Loading booking history\u2026',
            'Preparing revenue insights\u2026',
            'Almost ready\u2026'
          ];
          var msgEl  = document.getElementById('sp-msg');
          var idx    = 0;

          function showMsg() {
            if (!msgEl) return;
            msgEl.textContent = messages[idx % messages.length];
            idx++;
          }
          showMsg();
          var msgInterval = setInterval(showMsg, 2500);

          window.__splashCleanup = function () { clearInterval(msgInterval); };
        })();
      </script>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
