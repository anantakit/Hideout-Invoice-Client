<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0E0E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <title>Hideout — Hotel Operations</title>
    <script>
      // Prevent FOUC: apply saved theme class before first paint
      (function(){
        var t = localStorage.getItem('hideout-theme');
        var isLight = t ? t === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        if (isLight) document.documentElement.classList.add('light');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      ── Hideout Splash Screen — v3 FINAL ──
      Luxury hotel operations. Bracket frame = "Hideout" entrance.
      Stripe/Linear-level minimalism. Neutral + gold accent.
    -->
    <div id="splash" class="splash">
      <style>
        /* ── Tokens ───────────────────────────────────────────────────── */
        .splash {
          --sp-bg:          #0E0E0E;
          --sp-bg-el:       #151515;
          --sp-text:        #F2E9DC;
          --sp-text-sub:    rgba(242, 233, 220, 0.6);
          --sp-accent:      #CFA77A;
          --sp-accent-soft: #E7C9A5;
          --sp-spring:      cubic-bezier(0.16, 1, 0.3, 1);
          --sp-ease:        cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Root ─────────────────────────────────────────────────────── */
        .splash {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; align-items: center; justify-content: center;
          /* 3-layer background: subtle center glow → vignette → base */
          background:
            radial-gradient(circle at 50% 38%, rgba(255,255,255,0.04), transparent 60%),
            radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.6)),
            var(--sp-bg);
          overflow: hidden;
          font-family: Inter, system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing: antialiased;
          transition: opacity .5s var(--sp-ease);
        }

        /* ── Content — visual center correction ──────────────────────── */
        .splash__content {
          position: relative;
          display: flex; flex-direction: column; align-items: center;
          transform: translateY(-8px);
        }

        /* ── Logo entrance ───────────────────────────────────────────── */
        .splash__logo {
          opacity: 0;
          animation: sp-logo-in 500ms var(--sp-spring) 200ms forwards;
        }
        @keyframes sp-logo-in {
          from { opacity: 0; transform: translateY(6px) }
          to   { opacity: 1; transform: translateY(0) }
        }

        /* ── Bracket draw-in animation ────────────────────────────────── */
        .sp-bracket {
          stroke-dasharray: 130;
          stroke-dashoffset: 130;
          animation: sp-draw 800ms var(--sp-spring) 100ms forwards;
        }
        @keyframes sp-draw {
          to { stroke-dashoffset: 0 }
        }
        .sp-h-part {
          opacity: 0;
          animation: sp-fade-up 400ms var(--sp-spring) 500ms forwards;
        }
        .sp-h-part--2 { animation-delay: 580ms }
        .sp-h-part--3 { animation-delay: 660ms }

        /* ── Brand typography ─────────────────────────────────────────── */
        .splash__brand {
          margin-top: 18px;
          text-align: center;
          display: flex; flex-direction: column; align-items: center;
          opacity: 0;
          animation: sp-fade-up 600ms var(--sp-spring) 500ms forwards;
        }
        @keyframes sp-fade-up {
          from { opacity: 0; transform: translateY(6px) }
          to   { opacity: 1; transform: translateY(0) }
        }

        .splash__title {
          font-size: 30px; font-weight: 500;
          letter-spacing: 0.14em;
          color: var(--sp-text);
          line-height: 1;
          /* indent compensates letter-spacing for optical center */
          text-indent: 0.14em;
        }
        /* Optical kerning: H→I tighter (-1px), O→U tighter (-0.5px) */
        .sp-kern-hi { letter-spacing: 0.10em }
        .sp-kern-ou { letter-spacing: 0.12em }

        .splash__subtitle {
          margin-top: 4px;
          font-size: 11px; font-weight: 400;
          letter-spacing: 0.38em;
          color: var(--sp-text);
          opacity: 0.5;
          text-indent: 0.38em;
        }

        /* ── Loader — breathing shimmer (Linear-style) ───────────────── */
        .splash__loader {
          margin-top: 32px;
          width: 120px;
          opacity: 0;
          animation: sp-fade-up 500ms var(--sp-ease) 800ms forwards;
        }
        .splash__loader-track {
          height: 2px;
          background: rgba(255,255,255,0.06);
          border-radius: 999px;
          overflow: hidden;
        }
        .splash__loader-bar {
          width: 100%; height: 100%;
          background: linear-gradient(90deg, transparent, var(--sp-accent), transparent);
          animation: sp-breathe 1.8s ease-in-out infinite;
          transform-origin: center;
        }
        @keyframes sp-breathe {
          0%   { opacity: 0.3; transform: scaleX(0.92) }
          50%  { opacity: 1;   transform: scaleX(1) }
          100% { opacity: 0.3; transform: scaleX(0.92) }
        }

        /* ── Status text ─────────────────────────────────────────────── */
        .splash__status {
          margin-top: 10px;
          font-size: 12px; font-weight: 400;
          color: var(--sp-text-sub);
          letter-spacing: 0.01em;
          opacity: 0;
          animation: sp-fade-up 400ms var(--sp-ease) 1000ms forwards;
        }

        /* ── Reduced motion ───────────────────────────────────────────── */
        @media (prefers-reduced-motion: reduce) {
          .splash__logo,
          .splash__brand,
          .splash__loader,
          .splash__status { opacity: 1; animation: none; transform: none }
          .sp-bracket { stroke-dashoffset: 0; animation: none }
          .sp-h-part, .sp-h-part--2, .sp-h-part--3 { opacity: 1; animation: none }
          .splash__loader-bar { animation: none; opacity: 0.6 }
        }
      </style>

      <div class="splash__content">

        <!-- Logo mark — bracket + H monogram -->
        <div class="splash__logo">
          <svg width="68" height="80" viewBox="0 0 54 64" fill="none">
            <defs>
              <linearGradient id="sp-gold" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
                <stop offset="0%" stop-color="#E7C9A5"/>
                <stop offset="100%" stop-color="#CFA77A"/>
              </linearGradient>
            </defs>

            <!-- Bracket — thin gold frame, draws in first -->
            <path class="sp-bracket"
                  d="M22,2 L7,2 Q2,2 2,7 L2,57 Q2,62 7,62 L22,62"
                  stroke="url(#sp-gold)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

            <!-- H — bold, contained inside bracket, fades in after -->
            <rect class="sp-h-part" x="24" y="16" width="8" height="32" rx="3" fill="#E6E6E6"/>
            <rect class="sp-h-part sp-h-part--2" x="42" y="16" width="8" height="32" rx="3" fill="#E6E6E6"/>
            <rect class="sp-h-part sp-h-part--3" x="24" y="29" width="26" height="8" rx="3" fill="#E6E6E6"/>
          </svg>
        </div>

        <!-- Brand name — optical kerning on H→I and O→U -->
        <div class="splash__brand">
          <div class="splash__title"><span class="sp-kern-hi">H</span>IDE<span class="sp-kern-ou">O</span>UT</div>
          <div class="splash__subtitle">RESORT</div>
        </div>

        <!-- Breathing shimmer loader -->
        <div class="splash__loader">
          <div class="splash__loader-track">
            <div class="splash__loader-bar"></div>
          </div>
        </div>

        <!-- Status — abstract copy, not literal -->
        <div class="splash__status" id="sp-msg"></div>

      </div>

      <script>
        (function () {
          var messages = [
            'Preparing your workspace\u2026',
            'Loading operational data\u2026',
            'Initializing system\u2026'
          ];
          var msgEl = document.getElementById('sp-msg');
          var idx = 0;

          function show() {
            if (!msgEl) return;
            msgEl.textContent = messages[idx % messages.length];
            idx++;
          }
          show();
          var iv = setInterval(show, 2500);

          window.__splashCleanup = function () { clearInterval(iv) };
        })();
      </script>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
